version: 2

models:
  - name: employee
    description: "Employee DBT Model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5']
              config:
                severity: warn
      - name: emp_salary
        data_tests: 
          - salary_check
  - name: customer
    description: "Model for customer table"
  - name: sales
    description: "Model for the sales table"
  - name: product_x
    description: "Model for product table"
  - name: purchase
    description: "Model for purchase table"
  - name: clean_orders
    description: "Model for clean_orders ephemeral table"
  - name: final_orders
    description: "Model for Final Orders"
  - name: session
    description: "Model for sessions table"
  - name: concat_name
    description: "Model for name concatenation"
  - name: concat_address
    description: "Model for address concatenation"
    
sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
     - name: EMPLOYEE_RAW
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
    - name: CUSTOMER_SRC        
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC
  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC
  - name: orders
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS
  - name: patient
    database: DBT_DB
    schema: PUBLIC
    tables:
       - name: PATIENT_SRC
  - name: session 
    database: DBT_DB
    schema: PUBLIC
    tables:
       - name: SESSION_SRC